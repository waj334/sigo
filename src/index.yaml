# These packages will be included from the Go standard library when staging SiGo standard library.
include:
  - builtin
  - bytes
  - cmp
  - context
  - errors
  - internal/byteorder
  - internal/fmtsort
  - internal/saferio
  - internal/singleflight
  - internal/strconv
  - internal/stringslite
  - internal/oserror
  - internal/unsafeheader
  - internal/nettrace
  - internal/filepathlite
  - io
  - math
  - math/bits
  - net/netip
  - net/url
  - path
  - slices
  - strconv
  - strings
  - unicode
  - unicode/utf8
  - unique
  - weak

# These are required for IDEs
  - internal/buildcfg
  - internal/goexperiment
  - internal/goroot
  - internal/gover
  - internal/goversion

exclude:
  - io/fs
  - io/ioutil
  - path/filepath
